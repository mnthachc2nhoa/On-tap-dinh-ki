<!DOCTYPE html>
<html lang="vi">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Ôn tập giữa kì 1</title>
 <style>
 :root { --primary:#0056b3; --success:#28a745; --danger:#dc3545; --info:#17a2b8; --bg:#f4f6f9; }
 body { font-family:'Segoe UI', Tahoma, Geneva, sans-serif; background:var(--bg); margin:0; padding:20px; color:#333; }
 .container { max-width:850px; margin:0 auto; background:#fff; padding:25px 30px; border-radius:10px; box-shadow:0 4px 15px rgba(0,0,0,0.1); }
 .header { text-align:center; border-bottom:2px solid var(--primary); padding-bottom:15px; margin-bottom:20px; }
 .header h2 { margin:0 0 5px 0; color:var(--primary); text-transform:uppercase; }
 .info-section { display:flex; flex-wrap:wrap; gap:15px; background:#e9ecef; padding:15px; border-radius:8px; margin-bottom:20px; }
 .form-group { flex:1; min-width:200px; display:flex; align-items:center; gap:10px; }
 .form-group label { font-weight:bold; white-space:nowrap; }
 .form-group input { width:100%; padding:8px 12px; border:1px solid #ccc; border-radius:5px; font-size:15px; }
 .timer-sticky { position:sticky; top:10px; z-index:100; background:#fff3cd; border:2px solid #ffeeba; color:#856404; padding:10px 20px; border-radius:8px; text-align:center; font-size:16px; font-weight:bold; margin-bottom:20px; }
 .question-card { background:#fff; border:1px solid #e0e0e0; border-left:5px solid var(--primary); padding:18px 20px; margin-bottom:20px; border-radius:6px; }
 .question-card.tf-card { border-left-color: #17a2b8; }
 .question-title { font-size:16px; font-weight:600; margin-bottom:12px; line-height:1.5; }
 .badge { display:inline-block; padding:3px 8px; border-radius:4px; font-size:12px; font-weight:bold; color:#fff; margin-right:8px; vertical-align:middle; }
 .badge-mc { background:var(--primary); }
 .badge-tf { background:var(--info); }
 .options-list { list-style:none; padding:0; margin:0; }
 .option-item { margin-bottom:8px; }
 .option-item label { display:flex; align-items:center; padding:10px 14px; border:1px solid #ddd; border-radius:5px; cursor:pointer; }
 .option-item label:hover { background:#f8f9fa; }
 .option-item input { margin-right:12px; transform:scale(1.2); }
 .tf-table { width:100%; border-collapse:collapse; margin-top:10px; }
 .tf-table th, .tf-table td { border:1px solid #dee2e6; padding:10px 12px; font-size:14px; }
 .tf-table th { background:#f1f3f5; text-align:left; }
 .tf-options { display:flex; gap:15px; justify-content:center; }
 .tf-options label { cursor:pointer; font-weight:bold; display:flex; align-items:center; gap:4px; }
 .submit-btn { display:block; width:100%; padding:14px; background:var(--success); color:#fff; border:none; border-radius:6px; font-size:18px; font-weight:bold; cursor:pointer; }
 .submit-btn:hover { background:#218838; }
 .btn-retry { background:var(--primary); color:#fff; border:none; padding:12px 24px; border-radius:6px; font-size:16px; font-weight:bold; cursor:pointer; margin-top:15px; transition:0.2s; }
 .btn-retry:hover { background:#004085; }
 .result-box { display:none; text-align:center; padding:25px; background:#d4edda; border:1px solid #c3e6cb; color:#155724; border-radius:8px; margin-top:20px; }
 .score-display { font-size:36px; font-weight:bold; color:var(--danger); margin:10px 0; }
 .correct-ans { background-color:#d4edda !important; border-color:#28a745 !important; }
 .wrong-ans { background-color:#f8d7da !important; border-color:#dc3545 !important; }
 </style>
</head>
<body>
<div class="container" id="main-container">
 <div class="header">
 <h2>Ôn tập giữa kì 1</h2>
 <p><strong>Nội dung:</strong> Thiết bị số và Bảng tính</p>
 <p><strong>Luyện tập lượt số:</strong> <b id="attempt-display" style="color:red; font-size:18px;">1</b></p>
 </div>
 <div class="info-section">
 <div class="form-group"><label>Họ và tên:</label><input type="text" id="fullname" placeholder="Nhập đầy đủ họ tên..." required></div>
 <div class="form-group"><label>Lớp:</label><input type="text" id="classname" placeholder="Ví dụ: 12A1..." required></div>
 </div>
 <div class="timer-sticky" id="timer-box">⏱️ Thời gian ôn tập: <span id="timer">15:00</span></div>
 <form id="quiz-form">
 <div id="questions-container"></div>
 <button type="button" id="submit-btn" class="submit-btn" onclick="confirmAndSubmit()">NỘP BÀI VÀ XEM ĐÁP ÁN</button>
 </form>
 <div id="result-box" class="result-box">
 <h3>🎉 KẾT QUẢ ÔN TẬP</h3>
 <p id="student-info-display"></p>
 <div>Điểm số lượt này:</div>
 <div class="score-display" id="score-text">0 / 0</div>
 <p id="detail-text"></p>
 <div id="status-webhook" style="font-size:13px; color:#6c757d; margin-top:5px;"></div>
 <button type="button" class="btn-retry" onclick="resetForNewPractice()">🔄 Luyện tập lượt tiếp theo (Trộn đề mới)</button>
 </div>
</div>

const rawQuestions = JSON.parse(decodeURIComponent(escape(atob(ENCODED_DATA))));

let questions = [];
let timerInterval = null;
let timeLeft = 15 * 60;
let isSubmitted = false;
let currentAttempt = parseInt(localStorage.getItem('quiz_' + QUIZ_ID + '_attempt') || '1');

function shuffleArray(array) {
 let arr = [...array];
 for (let i = arr.length - 1; i > 0; i--) {
   const j = Math.floor(Math.random() * (i + 1));
   [arr[i], arr[j]] = [arr[j], arr[i]];
 }
 return arr;
}

function initQuiz() {
 document.getElementById("attempt-display").innerText = currentAttempt;
 
 // Khôi phục Họ tên & Lớp nếu đã từng nhập
 if (localStorage.getItem('quiz_' + QUIZ_ID + '_name')) {
   document.getElementById("fullname").value = localStorage.getItem('quiz_' + QUIZ_ID + '_name');
 }
 if (localStorage.getItem('quiz_' + QUIZ_ID + '_cls')) {
   document.getElementById("classname").value = localStorage.getItem('quiz_' + QUIZ_ID + '_cls');
 }

 const rawMc = rawQuestions.filter(q => q.type === 'mc');
 const rawTf = rawQuestions.filter(q => q.type === 'tf');

 const selectedMc = shuffleArray(rawMc).slice(0, Math.min(MC_QUIZ_COUNT, rawMc.length));
 const selectedTf = shuffleArray(rawTf).slice(0, Math.min(TF_QUIZ_COUNT, rawTf.length));

 questions = [...selectedMc, ...selectedTf].map(q => {
   if (q.type === 'mc') {
     let optionsWithFlag = q.options.map((optText, idx) => ({ text: optText, isCorrect: idx === q.answer }));
     return { type: 'mc', question: q.question, shuffledOptions: shuffleArray(optionsWithFlag) };
   } else {
     return { type: 'tf', question: q.question, items: q.items };
   }
 });

 const container = document.getElementById("questions-container");
 container.innerHTML = "";
 questions.forEach((q, qIndex) => {
   const qCard = document.createElement("div");
   qCard.className = "question-card" + (q.type === 'tf' ? ' tf-card' : '');
   
   if (q.type === 'mc') {
     qCard.innerHTML = `<div class="question-title"><span class="badge badge-mc">Trắc nghiệm</span>Câu ${qIndex + 1}: ${q.question}</div>`;
     const optionsList = document.createElement("ul");
     optionsList.className = "options-list";
     q.shuffledOptions.forEach((optObj, optIndex) => {
       const li = document.createElement("li");
       li.className = "option-item";
       li.innerHTML = `<label id="label-${qIndex}-${optIndex}"><input type="radio" name="question-${qIndex}" value="${optIndex}"> ${String.fromCharCode(65 + optIndex)}. ${optObj.text}</label>`;
       optionsList.appendChild(li);
     });
     qCard.appendChild(optionsList);
   } else {
     qCard.innerHTML = `<div class="question-title"><span class="badge badge-tf">Đúng / Sai</span>Câu ${qIndex + 1}: ${q.question}</div>`;
     let tableHtml = `<table class="tf-table">
       <thead><tr><th>Khẳng định</th><th style="width:140px; text-align:center;">Lựa chọn</th></tr></thead>
       <tbody>`;
     q.items.forEach((item, itemIdx) => {
       tableHtml += `<tr id="tf-row-${qIndex}-${itemIdx}">
         <td><b>${String.fromCharCode(97 + itemIdx)})</b> ${item.text} <span id="tf-hint-${qIndex}-${itemIdx}"></span></td>
         <td>
           <div class="tf-options">
             <label><input type="radio" name="tf-q${qIndex}-i${itemIdx}" value="true"> Đúng</label>
             <label><input type="radio" name="tf-q${qIndex}-i${itemIdx}" value="false"> Sai</label>
           </div>
         </td>
       </tr>`;
     });
     tableHtml += `</tbody></table>`;
     qCard.innerHTML += tableHtml;
   }
   container.appendChild(qCard);
 });
 startTimer();
}

function startTimer() {
 const timerDisplay = document.getElementById("timer");
 clearInterval(timerInterval);
 timerInterval = setInterval(() => {
   if (timeLeft <= 0) {
     clearInterval(timerInterval);
     alert("⏰ Đã hết thời gian gợi ý! Tự động nộp bài để xem đáp án.");
     submitQuiz();
   } else {
     timeLeft--;
     let m = Math.floor(timeLeft / 60), s = timeLeft % 60;
     timerDisplay.innerText = `${m < 10 ? '0':''}${m}:${s < 10 ? '0':''}${s}`;
   }
 }, 1000);
}

function confirmAndSubmit() {
 const name = document.getElementById("fullname").value.trim();
 const cls = document.getElementById("classname").value.trim();
 if (!name || !cls) { alert("⚠️ Vui lòng điền Họ tên và Lớp để theo dõi tiến độ!"); return; }

 let unanswered = 0;
 questions.forEach((q, qIndex) => {
   if (q.type === 'mc') {
     if (!document.querySelector(`input[name="question-${qIndex}"]:checked`)) unanswered++;
   } else {
     q.items.forEach((_, itemIdx) => {
       if (!document.querySelector(`input[name="tf-q${qIndex}-i${itemIdx}"]:checked`)) unanswered++;
     });
   }
 });

 let msg = "Bạn có chắc chắn muốn hoàn thành lượt ôn tập này?";
 if (unanswered > 0) msg = `⚠️ Bạn còn ${unanswered} câu / ý hỏi chưa trả lời! Vẫn muốn nộp bài chứ?`;
 if (confirm(msg)) submitQuiz();
}

function submitQuiz() {
 if (isSubmitted) return;
 const name = document.getElementById("fullname").value.trim() || "Học sinh";
 const cls = document.getElementById("classname").value.trim() || "Chưa nhập";
 
 // Lưu tên & lớp cho lần sau
 localStorage.setItem('quiz_' + QUIZ_ID + '_name', name);
 localStorage.setItem('quiz_' + QUIZ_ID + '_cls', cls);

 isSubmitted = true;
 clearInterval(timerInterval);

 let totalEarned = 0;
 let maxPossible = 0;

 questions.forEach((q, qIndex) => {
   if (q.type === 'mc') {
     maxPossible += SCORE_PER_ANS;
     const selectedRadio = document.querySelector(`input[name="question-${qIndex}"]:checked`);
     if (selectedRadio) {
       const userChoiceIndex = parseInt(selectedRadio.value);
       if (q.shuffledOptions[userChoiceIndex].isCorrect) {
         totalEarned += SCORE_PER_ANS;
         document.getElementById(`label-${qIndex}-${userChoiceIndex}`).classList.add("correct-ans");
       } else {
         document.getElementById(`label-${qIndex}-${userChoiceIndex}`).classList.add("wrong-ans");
       }
     }
     document.querySelectorAll(`input[name="question-${qIndex}"]`).forEach(r => r.disabled = true);
   } else if (q.type === 'tf') {
     maxPossible += (q.items.length * SCORE_PER_ANS);
     q.items.forEach((item, itemIdx) => {
       const selectedRadio = document.querySelector(`input[name="tf-q${qIndex}-i${itemIdx}"]:checked`);
       const rowElem = document.getElementById(`tf-row-${qIndex}-${itemIdx}`);
       const hintElem = document.getElementById(`tf-hint-${qIndex}-${itemIdx}`);
       
       if (selectedRadio) {
         const userChoice = (selectedRadio.value === 'true');
         if (userChoice === item.answer) {
           totalEarned += SCORE_PER_ANS;
           rowElem.classList.add("correct-ans");
         } else {
           rowElem.classList.add("wrong-ans");
           hintElem.innerHTML = `<br><small style="color:#dc3545; font-weight:bold;">❌ Đáp án đúng: ${item.answer ? 'Đúng' : 'Sai'}</small>`;
         }
       } else {
         rowElem.classList.add("wrong-ans");
         hintElem.innerHTML = `<br><small style="color:#dc3545; font-weight:bold;">⚠️ Bỏ trống (Đáp án đúng: ${item.answer ? 'Đúng' : 'Sai'})</small>`;
       }
       document.querySelectorAll(`input[name="tf-q${qIndex}-i${itemIdx}"]`).forEach(r => r.disabled = true);
     });
   }
 });

 const totalScoreText = totalEarned.toFixed(2);
 const maxScoreText = maxPossible.toFixed(2);

 document.getElementById("student-info-display").innerText = `Học sinh: ${name} - Lớp: ${cls} (Lượt ôn tập số: ${currentAttempt})`;
 document.getElementById("score-text").innerText = `${totalScoreText} / ${maxScoreText} điểm`;
 document.getElementById("detail-text").innerText = `Hãy xem lại các câu báo đỏ bên trên để rút kinh nghiệm nhé!`;
 document.getElementById("result-box").style.display = "block";
 document.getElementById("timer-box").style.display = "none";
 document.getElementById("submit-btn").style.display = "none";

 // Tự động gửi tiến độ ôn tập về Google Sheet
 if (WEBHOOK_URL) {
   const statusElem = document.getElementById("status-webhook");
   statusElem.innerText = "⏳ Đang tự động lưu tiến độ học tập...";
   fetch(WEBHOOK_URL, {
     method: "POST",
     mode: "no-cors",
     headers: { "Content-Type": "application/json" },
     body: JSON.stringify({
       quizTitle: "Ôn tập giữa kì 1",
       ca: "Lượt " + currentAttempt,
       name: name,
       class: cls,
       score: totalScoreText,
       maxScore: maxScoreText,
       submittedAt: new Date().toLocaleString('vi-VN')
     })
   }).then(() => {
     statusElem.innerHTML = "<span style='color:green;'>✅ Đã ghi nhận tiến độ bài ôn tập thành công!</span>";
   }).catch(() => {
     statusElem.innerHTML = "<span style='color:gray;'>⚠️ Đã hoàn thành ôn tập offline.</span>";
   });
 }

 document.getElementById("result-box").scrollIntoView({ behavior: 'smooth' });
}

function resetForNewPractice() {
 currentAttempt++;
 localStorage.setItem('quiz_' + QUIZ_ID + '_attempt', currentAttempt);
 isSubmitted = false;
 timeLeft = 15 * 60;
 
 document.getElementById("result-box").style.display = "none";
 document.getElementById("timer-box").style.display = "block";
 document.getElementById("submit-btn").style.display = "block";
 
 initQuiz();
 window.scrollTo({ top: 0, behavior: 'smooth' });
}

window.onload = initQuiz;
</script>
